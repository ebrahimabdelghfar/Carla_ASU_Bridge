# ─── Ground-Truth Tire Force Model ────────────────────────────────────────────
# Independent of CARLA's internal tire physics. Computed each telemetry tick
# from CARLA's own per-wheel slip/load telemetry (WheelTelemetryData) and
# published on feedback/tire_forces (sim_manager_msgs/TireForces).
#
# Wheel order everywhere below: FL, FR, RL, RR (matches vehicle.physics.wheels
# in carla_interface_config.yaml).

tire_model:
  enabled: true

  # ── Lateral force: simplified Magic Formula (Pacejka) ──────────────────
  #   alpha = telemetry.wheels[i].lat_slip        (read live from CARLA)
  #   Fz    = telemetry.wheels[i].tire_load        (read live from CARLA, N)
  #   mu    = phys.wheels[i].tire_friction  (read live from CARLA — NOT
  #           configured here; set via vehicle.physics.wheels[*].tire_friction
  #           in carla_interface_config.yaml, or overridden at runtime on
  #           /sim/control/tire_friction)
  #   D     = mu * Fz
  #   Fy    = D * sin(C * atan(B*alpha - E*(B*alpha - atan(B*alpha))))
  magic_formula:
    wheels:
      - position: "FL"
        B: 10.0    # stiffness factor
        C: 1.9     # shape factor
        E: 0.97    # curvature factor
      - position: "FR"
        B: 10.0
        C: 1.9
        E: 0.97
      - position: "RL"
        B: 10.0
        C: 1.9
        E: 0.97
      - position: "RR"
        B: 10.0
        C: 1.9
        E: 0.97

  # ── Longitudinal force: Pacejka drivetrain model ────────────────────────
  # Standard RC/race-car longitudinal model (Liniger et al., "Optimization-
  # Based Autonomous Racing of 1:43 Scale RC Cars"). Independent of CARLA's
  # own engine torque_curve. vx = forward speed (m/s), T = throttle (0..1).
  #   Frx = (Cm1 - Cm2 * vx) * T - Cr0 - Cd * vx^2
  # Cm1/Cm2 (drive force, back-EMF falloff) apply per driven wheel — only
  # wheels engaged by vehicle.drive_mode (carla_interface_config.yaml:
  # AWD/FWD/RWD) receive it. Cr0/Cd (rolling resistance, aero drag) act on
  # the whole car and are split evenly across all 4 wheels, opposing motion.
  # Braking still uses each wheel's max_brake_torque (carla_interface_config.yaml),
  # added on top of this model.
  motor:
    Cm1: 8000.0   # N, drive-force constant per driven wheel at throttle=1, vx=0
    Cm2: 150.0    # N·s/m, per-driven-wheel back-EMF falloff (drive force → 0 near vx ≈ Cm1/Cm2)
    Cr0: 60.0     # N, total rolling resistance (whole car, split across 4 wheels)
    Cd: 0.45       # N·s²/m², total aerodynamic drag coefficient (whole car, split across 4 wheels)
