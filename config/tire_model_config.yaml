# ─── Ground-Truth Tire Force Model ────────────────────────────────────────────
# Independent of CARLA's internal tire physics. Computed each telemetry tick
# from CARLA's own per-wheel slip/load telemetry (WheelTelemetryData) and
# published on feedback/tire_forces (micropilot_manager_msgs/TireForces).
#
# Wheel order everywhere below: FL, FR, RL, RR (matches vehicle.physics.wheels
# in carla_interface_config.yaml).

tire_model:
  enabled: true

  # ── Lateral force: simplified Magic Formula (Pacejka) ──────────────────
  #   alpha = telemetry.wheels[i].lat_slip        (read live from CARLA)
  #   Fz    = telemetry.wheels[i].tire_load        (read live from CARLA, N)
  #   D     = mu * Fz
  #   Fy    = D * sin(C * atan(B*alpha - E*(B*alpha - atan(B*alpha))))
  magic_formula:
    wheels:
      - position: "FL"
        B: 10.0    # stiffness factor
        C: 1.9     # shape factor
        E: 0.97    # curvature factor
        mu: 1.6    # friction coefficient (peak D = mu * tire_load)
      - position: "FR"
        B: 10.0
        C: 1.9
        E: 0.97
        mu: 1.6
      - position: "RL"
        B: 10.0
        C: 1.9
        E: 0.97
        mu: 1.6
      - position: "RR"
        B: 10.0
        C: 1.9
        E: 0.97
        mu: 1.6

  # ── Longitudinal force: motor-torque-constant model ────────────────────
  # Independent of CARLA's own engine torque_curve. Only wheels engaged by
  # vehicle.drive_mode (carla_interface_config.yaml: AWD/FWD/RWD) receive
  # motor force; braking uses each wheel's max_brake_torque (also from
  # carla_interface_config.yaml).
  #   F_long = drive_engaged * (torque_constant_Nm * throttle * gear_ratio
  #                              * drivetrain_efficiency) / wheel_radius_m
  #            - brake * wheel.max_brake_torque / wheel_radius_m
  motor:
    torque_constant_Nm: 250.0        # Nm at throttle = 1.0, per driven wheel
    gear_ratio: 8.0
    drivetrain_efficiency: 0.95
