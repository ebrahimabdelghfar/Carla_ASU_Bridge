# ─── Scenario Bag Recording ───────────────────────────────────────────────────
# Selects WHICH sensor groups run_csv_scenarios.py records into a ROS 2 bag while
# a scenario is running. Topic NAMES are never listed here — they are resolved
# from config/carla_interface_config.yaml (applying the ros2.namespace rule), so
# renaming a topic there is picked up automatically.
#
# Behavior: recording starts once the scenario is fully loaded and ticking; on a
# PASS the bag is deleted, on Failed/Time Out it is kept for debugging under
# scenarios_bags/<scenario_name>_<YYYYmmdd_HHMMSS>.

record:
  cameras:
    enabled: true
    include_camera_info: false      # also record each camera's camera_info topic
    include_third_person: true    # third_person_view chase/debug camera
  lidars:
    enabled: true
  odom: true
  gps:
    enabled: true
    include_velocity: true         # record feedback/gps_vel in addition to feedback/gps
  battery: true

bag:
  storage_id: "mcap"          # mcap | sqlite3  (mcap = indexed, low-overhead, fewer drops)
  compression_mode: "none"    # none | file | message  (none = no CPU cost, no drop risk)
  compression_format: "zstd"  # used only when compression_mode != none
  max_cache_size: 536870912   # bytes; 512 MB write buffer to absorb sensor bursts
  output_dir: "scenarios_bags"  # under asurt/ (the parent dir of scenario_runner/)
